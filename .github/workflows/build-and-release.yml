name: Build and release

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'CHANGE.md'
      - 'doc/*'
      - '.github/*'

permissions:
  contents: write

env:
  NODE_VERSION: '22.23.0'
  ESP32_PACK_VERSION: '1.0.0'
  AI_ML_PACK_VERSION: '1.0.1'
  ARDUINO_R4_PACK_VERSION: '1.0.1'
  MICROBIT_PYTHON_PACK_VERSION: '1.0.1'

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate version tag
        run: |
          node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Expected tag ' + expected);"

      - name: Get tag
        id: tag
        uses: dawidd6/action-get-tag@v1

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: DoGoBlock Desktop ${{ steps.tag.outputs.tag }}
          body: |
            ## DoGoBlock Desktop 2.6.35

            - Inclui a GUI atualizada, melhorias no editor de fantasias e fontes offline.
            - Atualiza VM e Link com as correções atuais de conexão Arduino e micro:bit.
            - Corrige a compilação de sintaxe JavaScript moderna nas dependências do micro:bit.
            - Mantém ESP32, Arduino R4, Python do micro:bit e IA/ML como pacotes opcionais.
            - Valida os manifestos dos pacotes e fixa as mesmas revisões nos builds Windows e Linux.
            - Corrige a validação do executável Python do micro:bit no Windows.
          draft: true
          prerelease: false
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}

  build-windows:
    needs: create-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenBlock VM
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-vm
          ref: bd06a9095d874b5ddb5e5ddff24a2b35fee84274
          path: openblock-vm

      - name: Checkout OpenBlock GUI
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-gui-dogo
          ref: 095956c795fb4b81f273305f6f3193f5363a2122
          path: openblock-gui

      - name: Checkout OpenBlock Link
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-link-dogo
          ref: 043b3dcf469fccc47f3c6e04d09cf3370c7584b4
          path: openblock-link

      - name: Checkout OpenBlock Blocks
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-blocks
          ref: f6756c388d0086491f8b01f439802d5e663372f2
          path: openblock-blocks

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use Python 3.11 for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp
        shell: pwsh
        run: |
          npm install --global node-gyp@10.3.1
          $nodeGyp = Join-Path (npm root -g) 'node-gyp/bin/node-gyp.js'
          "npm_config_node_gyp=$nodeGyp" >> $env:GITHUB_ENV
          "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
          "npm_config_python=$env:pythonLocation\python.exe" >> $env:GITHUB_ENV

      - name: Npm Install
        shell: pwsh
        run: |
          npm ci

      - name: Test optional resource packs
        run: npm run test:resource-packs

      - name: Download resource pack manifests
        shell: pwsh
        run: |
          $packs = @(
            @{ Id = "esp32"; Version = $env:ESP32_PACK_VERSION },
            @{ Id = "ai-ml"; Version = $env:AI_ML_PACK_VERSION },
            @{ Id = "arduino-r4"; Version = $env:ARDUINO_R4_PACK_VERSION },
            @{ Id = "microbit-python"; Version = $env:MICROBIT_PYTHON_PACK_VERSION }
          )
          foreach ($pack in $packs) {
            $url = "https://github.com/educarbr11/openblock-desktop-dogo/releases/download/$($pack.Id)-pack-v$($pack.Version)/$($pack.Id).json"
            for ($attempt = 1; ; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile "resource-packs/$($pack.Id).json"
                break
              } catch {
                if ($attempt -ge 20) { throw }
                Write-Host "Waiting for the $($pack.Id) manifest ($attempt/20)..."
                Start-Sleep -Seconds 30
              }
            }
          }
          npm run resource-pack:verify -- --remote

      - name: Build Dist
        shell: pwsh
        env:
          GA_ID: ${{ secrets.GA_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          SENTRY_RELEASE: dogoblock-desktop@${{ github.ref_name }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=4096
          OPENBLOCK_VM_PATH: ${{ github.workspace }}/openblock-vm
          OPENBLOCK_GUI_PATH: ${{ github.workspace }}/openblock-gui
          OPENBLOCK_LINK_PATH: ${{ github.workspace }}/openblock-link
          OPENBLOCK_BLOCKS_PATH: ${{ github.workspace }}/openblock-blocks
        run: npm run dist

      - name: Verify update metadata
        shell: bash
        run: npm run verify:update -- --packaged

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/DoGoBlock*.exe
            dist/DoGoBlock*.exe.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenBlock VM
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-vm
          ref: bd06a9095d874b5ddb5e5ddff24a2b35fee84274
          path: openblock-vm

      - name: Checkout OpenBlock GUI
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-gui-dogo
          ref: 095956c795fb4b81f273305f6f3193f5363a2122
          path: openblock-gui

      - name: Checkout OpenBlock Link
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-link-dogo
          ref: 043b3dcf469fccc47f3c6e04d09cf3370c7584b4
          path: openblock-link

      - name: Checkout OpenBlock Blocks
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-blocks
          ref: f6756c388d0086491f8b01f439802d5e663372f2
          path: openblock-blocks

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ libudev-dev libusb-1.0-0-dev rpm

      - name: Npm Install
        run: npm ci

      - name: Test optional resource packs
        run: npm run test:resource-packs

      - name: Download resource pack manifests
        run: |
          while read -r pack version; do
            curl --fail --location --retry 20 --retry-all-errors --retry-delay 30 \
              --connect-timeout 15 --max-time 60 \
              "https://github.com/educarbr11/openblock-desktop-dogo/releases/download/${pack}-pack-v${version}/${pack}.json" \
              --output "resource-packs/${pack}.json"
          done <<EOF
          esp32 ${ESP32_PACK_VERSION}
          ai-ml ${AI_ML_PACK_VERSION}
          arduino-r4 ${ARDUINO_R4_PACK_VERSION}
          microbit-python ${MICROBIT_PYTHON_PACK_VERSION}
          EOF
          npm run resource-pack:verify -- --remote

      - name: Fix chrome-sandbox permissions
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Patch electron-builder-wrapper.js
        # Due to some unknown reasons, the packaging operation will report
        # an error when it is successful on the Linux CI. We need to ignore
        # the error here and let CI continue.
        # https://github.com/electron-userland/electron-builder/issues/8456
        run: |
          sed -i '/if\s*(\s*result\.status\s*)\s*{/a\
          \ \ \ \ if (target.platform === '\''linux'\'' && result.status === 1) {\n\
          \ \ \ \ \ \ \ \ return; // ignore error on linux\n\
          \ \ \ \ }
          ' scripts/electron-builder-wrapper.js

      - name: Build Dist
        env:
          GA_ID: ${{ secrets.GA_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          SENTRY_RELEASE: dogoblock-desktop@${{ github.ref_name }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false
          OPENBLOCK_VM_PATH: ${{ github.workspace }}/openblock-vm
          OPENBLOCK_GUI_PATH: ${{ github.workspace }}/openblock-gui
          OPENBLOCK_LINK_PATH: ${{ github.workspace }}/openblock-link
          OPENBLOCK_BLOCKS_PATH: ${{ github.workspace }}/openblock-blocks
        run: npm run dist

      - name: Verify update metadata
        run: npm run verify:update -- --packaged

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/DoGoBlock*.AppImage
            dist/DoGoBlock*.deb
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs:
      - create-release
      - build-windows
      - build-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false
