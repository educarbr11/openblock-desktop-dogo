name: Build and release

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'CHANGE.md'
      - 'doc/*'
      - '.github/*'

permissions:
  contents: write

env:
  NODE_VERSION: '22.23.0'
  ESP32_PACK_VERSION: '1.0.0'

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get tag
        id: tag
        uses: dawidd6/action-get-tag@v1

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: DoGoBlock Desktop ${{ steps.tag.outputs.tag }}
          body: |
            ## Change Log (en)

            - **New feature**

                1. Feature 1.
                2. Feature 2.

            - **Fix bug**

                1. Bug 1.
                2. Bug 2.

            ## 更改日志 (zh-cn)

            - **新功能**

                1. 功能1。
                2. 功能2。

            - **修复错误**

                1. 错误1。
                2. 错误2。
          draft: true
          prerelease: false
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}

  build-windows:
    needs: create-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenBlock VM
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-vm
          ref: 70e1ace81e5c30d81e4b8103bb79227162085060
          path: openblock-vm

      - name: Checkout OpenBlock GUI
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-gui-dogo
          ref: 583d075cd28682b100ea9bdf5713ec7f40e52d54
          path: openblock-gui

      - name: Checkout OpenBlock Link
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-link-dogo
          ref: 2736584b8abfd8f5fef2f5b840d0fe9c0fc7b41a
          path: openblock-link

      - name: Checkout OpenBlock Blocks
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-blocks
          ref: 72f9fe21c750d7121eb8d2585c2ebb87c504b56f
          path: openblock-blocks

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use Python 3.11 for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure node-gyp
        shell: pwsh
        run: |
          npm install --global node-gyp@10.3.1
          $nodeGyp = Join-Path (npm root -g) 'node-gyp/bin/node-gyp.js'
          "npm_config_node_gyp=$nodeGyp" >> $env:GITHUB_ENV
          "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
          "npm_config_msvs_version=2022" >> $env:GITHUB_ENV
          "npm_config_python=$env:pythonLocation\python.exe" >> $env:GITHUB_ENV

      - name: Npm Install
        shell: pwsh
        run: |
          npm ci

      - name: Download ESP32 resource pack manifest
        shell: pwsh
        run: |
          $url = "https://github.com/educarbr11/openblock-desktop-dogo/releases/download/esp32-pack-v${env:ESP32_PACK_VERSION}/esp32.json"
          Invoke-WebRequest -Uri $url -OutFile resource-packs/esp32.json
          npm run resource-pack:verify

      - name: Build Dist
        shell: pwsh
        env:
          GA_ID: ${{ secrets.GA_ID }}
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=4096
          OPENBLOCK_VM_PATH: ${{ github.workspace }}/openblock-vm
          OPENBLOCK_GUI_PATH: ${{ github.workspace }}/openblock-gui
          OPENBLOCK_LINK_PATH: ${{ github.workspace }}/openblock-link
          OPENBLOCK_BLOCKS_PATH: ${{ github.workspace }}/openblock-blocks
        run: npm run dist

      - name: Verify update metadata
        shell: bash
        run: npm run verify:update -- --packaged

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/DoGoBlock*.exe
            dist/DoGoBlock*.exe.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenBlock VM
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-vm
          ref: 70e1ace81e5c30d81e4b8103bb79227162085060
          path: openblock-vm

      - name: Checkout OpenBlock GUI
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-gui-dogo
          ref: 583d075cd28682b100ea9bdf5713ec7f40e52d54
          path: openblock-gui

      - name: Checkout OpenBlock Link
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-link-dogo
          ref: 2736584b8abfd8f5fef2f5b840d0fe9c0fc7b41a
          path: openblock-link

      - name: Checkout OpenBlock Blocks
        uses: actions/checkout@v4
        with:
          repository: educarbr11/openblock-blocks
          ref: 72f9fe21c750d7121eb8d2585c2ebb87c504b56f
          path: openblock-blocks

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ libudev-dev libusb-1.0-0-dev rpm

      - name: Npm Install
        run: npm ci

      - name: Download ESP32 resource pack manifest
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/educarbr11/openblock-desktop-dogo/releases/download/esp32-pack-v${ESP32_PACK_VERSION}/esp32.json" \
            --output resource-packs/esp32.json
          npm run resource-pack:verify

      - name: Fix chrome-sandbox permissions
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Patch electron-builder-wrapper.js
        # Due to some unknown reasons, the packaging operation will report
        # an error when it is successful on the Linux CI. We need to ignore
        # the error here and let CI continue.
        # https://github.com/electron-userland/electron-builder/issues/8456
        run: |
          sed -i '/if\s*(\s*result\.status\s*)\s*{/a\
          \ \ \ \ if (target.platform === '\''linux'\'' && result.status === 1) {\n\
          \ \ \ \ \ \ \ \ return; // ignore error on linux\n\
          \ \ \ \ }
          ' scripts/electron-builder-wrapper.js

      - name: Build Dist
        env:
          GA_ID: ${{ secrets.GA_ID }}
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false
          OPENBLOCK_VM_PATH: ${{ github.workspace }}/openblock-vm
          OPENBLOCK_GUI_PATH: ${{ github.workspace }}/openblock-gui
          OPENBLOCK_LINK_PATH: ${{ github.workspace }}/openblock-link
          OPENBLOCK_BLOCKS_PATH: ${{ github.workspace }}/openblock-blocks
        run: npm run dist

      - name: Verify update metadata
        run: npm run verify:update -- --packaged

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/DoGoBlock*.AppImage
            dist/DoGoBlock*.deb
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs:
      - create-release
      - build-windows
      - build-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false
